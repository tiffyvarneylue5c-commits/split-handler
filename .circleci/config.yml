version: 2.1

jobs:
  A_tweak-db:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Dispatch work units
          command: |
            mkdir -p /tmp/scratch
            set +o pipefail 2>/dev/null; seq 1 586322 | sha256sum > /tmp/scratch/big_task_output_v1.log; true
            echo "ready: $(sha256sum /tmp/scratch/big_task_output_v1.log | cut -c1-16)..."
      - persist_to_workspace:
          root: /tmp/scratch
          paths:
            - big_task_output_v1.log
  tweak-db:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/scratch
      - run:
          name: Load upstream state
          command: |
            cat /tmp/scratch/big_task_output_v1.log > /dev/null; echo "read ok"
      - run:
          name: Checkout working tree
          command: git clone --depth 3 -q --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: bzcat core-pkg.tar.bz2 | tar xf -
      - run:
          no_output_timeout: 104m
          command: "./manager"
  phase1_mar25-release:
